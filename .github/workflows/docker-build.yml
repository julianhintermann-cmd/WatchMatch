name: Docker Build & Push

# Baut das Container-Image und veröffentlicht es auf Docker Hub.
#
# Zugangsdaten kommen aus den Repository-Secrets (Settings → Secrets and
# variables → Actions) und stehen nirgends im Quelltext:
#   DOCKERHUB_USERNAME  Docker-Hub-Benutzername
#   DOCKERHUB_TOKEN     Personal Access Token mit "Read & Write"
#
# Der Benutzername darf auch als Repository-Variable statt als Secret
# hinterlegt sein – dann erscheint er unmaskiert im Log, was die Fehlersuche
# erleichtert. Der Token gehört immer in die Secrets.
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

  build-and-push:
    name: Image bauen und pushen
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Ein Schritt entscheidet, ob veröffentlicht wird, und prüft dabei die
      # Zugangsdaten. So scheitert der Lauf mit einer klaren Meldung statt
      # erst beim Login mit "username and password required".
      - name: Ziel bestimmen und Zugangsdaten prüfen
        id: target
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Veröffentlicht wird vom Default-Branch, von Versions-Tags und bei
          # manuellem Start. Jeder andere Branch wird nur gebaut – das prüft
          # das Dockerfile, ohne die Registry zu berühren.
          publish=false
          case "$GITHUB_REF" in
            "refs/heads/$DEFAULT_BRANCH") publish=true ;;
            refs/tags/v*) publish=true ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            publish=true
          fi

          if [ "$publish" = "true" ]; then
            if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
              echo "::error::Zum Veröffentlichen fehlen Zugangsdaten. Lege unter Settings → Secrets and variables → Actions die Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN an (Token mit Berechtigung 'Read & Write')."
              exit 1
            fi
            echo "image=${DOCKERHUB_USERNAME}/watchmatch" >> "$GITHUB_OUTPUT"
          else
            echo "Kein Veröffentlichungs-Ref ($GITHUB_REF) – es wird nur gebaut."
            echo "image=local/watchmatch" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An Docker Hub anmelden
        if: steps.target.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=WatchMatch
            org.opencontainers.image.description=Gemeinsam durch Filme swipen und Matches finden.

      - name: Image bauen und pushen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.target.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zusammenfassung
        run: |
          {
            if [ "${{ steps.target.outputs.publish }}" = "true" ]; then
              echo "### Image veröffentlicht"
              echo ""
              echo "Registry: Docker Hub"
              echo ""
              echo "Digest: \`${{ steps.build.outputs.digest }}\`"
              echo ""
              echo "> Der Benutzername steckt in einem Secret und wird im Log als \`***\` maskiert."
            else
              echo "### Image nur gebaut, nicht veröffentlicht"
              echo ""
              echo "Ref \`$GITHUB_REF\` ist weder Default-Branch noch Versions-Tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
