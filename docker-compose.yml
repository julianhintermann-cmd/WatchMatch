# ---------------------------------------------------------------------------
# WatchMatch – Docker Compose
#
# Schnellstart (baut lokal, ohne Registry):
#     cp .env.example .env
#     docker compose up -d
#     -> http://localhost:3000
#
# Fertiges Image von Docker Hub holen: DOCKERHUB_USERNAME in der .env setzen,
# dann `docker compose pull && docker compose up -d`. Compose liest die .env
# im Projektordner automatisch.
#
# Ohne gesetzten DOCKERHUB_USERNAME heißt das lokal gebaute Image
# `watchmatch-local/watchmatch:latest` – bewusst ein Name, den es auf Docker
# Hub nicht gibt, damit niemand versehentlich ein fremdes Image zieht.
# ---------------------------------------------------------------------------

services:
  watchmatch:
    image: ${DOCKERHUB_USERNAME:-watchmatch-local}/watchmatch:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchmatch
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Leer lassen -> die App nutzt die mitgelieferten Fallback-Filme.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
